name: Signed Android package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare private signing key
        env:
          STORE_BASE64: ${{ secrets.POCKET_SIGNING_KEY }}
        run: |
          test -n "$STORE_BASE64"
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocket-release.jks"
          chmod 600 "$RUNNER_TEMP/pocket-release.jks"
      - name: Validate and build signed APK
        env:
          POCKET_SIGNING_STORE: ${{ runner.temp }}/pocket-release.jks
          POCKET_SIGNING_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Generate updater manifest
        run: |
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk release/pocket-local-assistant-0.1.0-arm64.apk
          python scripts/make_update.py release/pocket-local-assistant-0.1.0-arm64.apk --version 0.1.0 --code 1 --output release/update.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-android-package
          path: release/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v0.1.0"
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "随身 AI 0.1.0" --notes-file RELEASE_NOTES.md
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pocket-release.jks"
